<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#075985">
<title>Inventario de Insumos | Agua Clara</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/favicon_64.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<style>
:root{--azul:#0077b6;--azul-oscuro:#034d75;--fondo:#edf6fa;--texto:#17324d;--gris:#667085;--borde:#dbe7ed;--verde:#198754;--rojo:#c1121f;--naranja:#e97912}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--texto);background:var(--fondo)}
button,input,select{font:inherit}
.cabecera{padding:18px;color:white;background:linear-gradient(135deg,var(--azul),var(--azul-oscuro));box-shadow:0 4px 20px rgba(3,77,117,.2)}
.cabecera-interior{max-width:1120px;margin:auto}
.barra{display:flex;align-items:center;justify-content:space-between;gap:14px}
.marca{display:flex;align-items:center;gap:12px}.marca img{width:56px;height:56px;object-fit:contain}.marca h1{margin:0;font-size:clamp(23px,5vw,32px)}.marca p{margin:4px 0 0;opacity:.88}
.acciones{display:flex;gap:8px}.btn-icono{width:46px;height:46px;padding:0;color:white;border:1px solid rgba(255,255,255,.35);border-radius:12px;background:rgba(255,255,255,.12);cursor:pointer;font-size:20px}
.perfil{margin-top:15px;padding:12px 14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:13px}.perfil strong,.perfil span{display:block}.perfil span{margin-top:3px;opacity:.85;font-size:13px}
main{width:min(1120px,calc(100% - 28px));margin:20px auto 42px}
h2{margin:0 0 12px;font-size:21px}

/* Existencias */
.existencias{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.insumo{padding:18px;background:white;border:1px solid var(--borde);border-radius:17px;box-shadow:0 7px 24px rgba(3,77,117,.08)}
.insumo-cabecera{display:flex;align-items:center;gap:10px}
.insumo-icono{width:46px;height:46px;display:grid;place-items:center;border-radius:13px;background:#e0f2fe;font-size:24px}
.insumo-cabecera span{color:var(--gris);font-size:14px;font-weight:bold}
.insumo .cantidad{margin:12px 0 4px;font-size:40px;font-weight:bold;line-height:1}
.insumo .unidad{color:var(--gris);font-size:13px}
.insumo .minimo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--borde);color:var(--gris);font-size:13px}
.insumo .minimo button{padding:6px 10px;color:var(--azul-oscuro);background:#f1f8fb;border:1px solid var(--borde);border-radius:8px;cursor:pointer;font-size:13px;font-weight:bold}
.insumo.bajo{border-color:rgba(193,18,31,.45);background:#fff6f7}
.insumo.bajo .cantidad{color:var(--rojo)}
.insumo.bajo .insumo-icono{background:#fde2e4}
.aviso-bajo{display:none;margin-top:8px;padding:6px 10px;color:var(--rojo);background:#fde2e4;border-radius:8px;font-size:12px;font-weight:bold}
.insumo.bajo .aviso-bajo{display:inline-block}
.negativo{display:none;margin-top:8px;padding:6px 10px;color:#7a5a00;background:#fff4d6;border-radius:8px;font-size:12px;font-weight:bold}
.insumo.en-negativo .negativo{display:inline-block}

/* Registrar */
.tarjeta{padding:18px;background:white;border:1px solid var(--borde);border-radius:17px;box-shadow:0 7px 24px rgba(3,77,117,.08);margin-bottom:20px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;padding:6px;background:#dfeef4;border-radius:14px}
.tipo{min-height:48px;padding:10px;color:var(--texto);background:transparent;border:0;border-radius:10px;cursor:pointer;font-weight:bold}
.tipo.activo{color:white;background:var(--azul);box-shadow:0 4px 12px rgba(0,119,182,.24)}
.ayuda{margin:0 0 14px;padding:11px 13px;color:#41566b;background:#f7fafb;border-left:4px solid #b8ddeb;border-radius:9px;font-size:14px;line-height:1.45}
.formulario{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:12px;align-items:end}
label{display:block;margin-bottom:7px;font-size:14px;font-weight:bold}
input,select{width:100%;min-height:48px;padding:11px 13px;color:var(--texto);background:white;border:1px solid var(--borde);border-radius:10px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--azul);box-shadow:0 0 0 4px rgba(0,119,182,.1)}
.btn-guardar{min-height:48px;min-width:150px;padding:11px 16px;color:white;background:var(--verde);border:0;border-radius:10px;cursor:pointer;font-weight:bold;font-size:16px}
.btn-guardar:disabled{opacity:.6;cursor:default}
.mensaje{margin:12px 0 0;font-size:14px;font-weight:bold}
.mensaje.ok{color:var(--verde)}.mensaje.error{color:var(--rojo)}

/* Historial */
.historial-cabecera{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.historial-cabecera h2{margin:0}
.historial-cabecera select{width:auto;min-width:190px}
.movimientos{overflow:hidden;background:white;border:1px solid var(--borde);border-radius:17px;box-shadow:0 7px 24px rgba(3,77,117,.08)}
.mov{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--borde)}
.mov:last-child{border-bottom:0}
.mov-fecha{color:var(--gris);font-size:13px;line-height:1.35}
.mov-detalle strong{display:block;font-size:15px}
.mov-detalle span{display:block;margin-top:3px;color:var(--gris);font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.etiqueta{display:inline-block;margin-right:6px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:bold;vertical-align:middle}
.et-entrada{color:#0f6b3d;background:#e3f7ec}.et-conteo{color:#075985;background:#e0f2fe}.et-cierre{color:#9a4b00;background:#fff0e0}
.mov-cantidad{text-align:right}
.mov-cantidad strong{display:block;font-size:18px}
.mov-cantidad span{display:block;margin-top:2px;color:var(--gris);font-size:12px}
.suma{color:var(--verde)}.resta{color:var(--rojo)}.cero{color:var(--gris)}
.vacio{padding:42px 20px;text-align:center;color:var(--gris)}
.vacio div{font-size:40px}
.mov-detalle .etiqueta{display:inline-block;margin:0 6px 0 0}
.btn-mas[hidden]{display:none}
.btn-mas{display:block;width:100%;padding:13px;color:var(--azul-oscuro);background:#f7fbfc;border:0;border-top:1px solid var(--borde);cursor:pointer;font-weight:bold}

@media(max-width:820px){.formulario{grid-template-columns:1fr 1fr}.formulario .nota{grid-column:1/-1}.btn-guardar{grid-column:1/-1}}
@media(max-width:620px){.existencias{grid-template-columns:1fr}.insumo{display:grid;grid-template-columns:1fr auto;align-items:center}.insumo .cantidad{margin:0;text-align:right}.insumo .unidad{grid-column:2;text-align:right}.insumo .minimo,.insumo .aviso-bajo,.insumo .negativo{grid-column:1/-1}}
@media(max-width:500px){.marca p{display:none}.formulario{grid-template-columns:1fr}.mov{grid-template-columns:1fr auto}.mov-fecha{grid-column:1/-1}.historial-cabecera{flex-direction:column;align-items:stretch}.historial-cabecera select{width:100%}}
</style>
</head>
<body>

<header class="cabecera"><div class="cabecera-interior">
    <div class="barra">
        <div class="marca"><img src="img/logo_menu_192.webp" alt="Agua Clara"><div><h1>Inventario de Insumos</h1><p>Botellones, tapones y sellos de garantía</p></div></div>
        <div class="acciones">
            <button class="btn-icono" title="Actualizar" onclick="cargarTodo()">↻</button>
            <button class="btn-icono" title="Menú" onclick="location.href='menu.html'">⌂</button>
        </div>
    </div>
    <div class="perfil"><strong id="nombreAdministrador">Cargando administrador...</strong><span>Se descuenta automáticamente al guardar cada cierre de viaje</span></div>
</div></header>

<main>

<section id="existencias" class="existencias"></section>

<section class="tarjeta">
    <h2>Registrar movimiento</h2>
    <div class="tipos">
        <button id="tipoEntrada" class="tipo activo" type="button" onclick="cambiarTipo('entrada')">📥 Entrada / compra</button>
        <button id="tipoConteo" class="tipo" type="button" onclick="cambiarTipo('conteo')">🔢 Conteo físico</button>
    </div>
    <p id="ayudaTipo" class="ayuda"></p>
    <div class="formulario">
        <div>
            <label for="insumo">Insumo</label>
            <select id="insumo"></select>
        </div>
        <div>
            <label id="etiquetaCantidad" for="cantidad">Cantidad que entra</label>
            <input id="cantidad" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
        </div>
        <div class="nota">
            <label for="nota">Nota (opcional)</label>
            <input id="nota" type="text" maxlength="300" placeholder="Ej.: compra a proveedor, factura 123">
        </div>
        <button id="btnGuardar" class="btn-guardar" type="button" onclick="guardarMovimiento()">💾 Guardar</button>
    </div>
    <p id="mensaje" class="mensaje"></p>
</section>

<div class="historial-cabecera">
    <h2>Historial de movimientos</h2>
    <select id="filtroInsumo" onchange="cargarMovimientos(true)">
        <option value="">Todos los insumos</option>
    </select>
</div>
<section class="movimientos">
    <div id="listaMovimientos"><div class="vacio"><div>⏳</div>Cargando...</div></div>
    <button id="btnMas" class="btn-mas" type="button" onclick="cargarMovimientos(false)" hidden>Ver más movimientos</button>
</section>

</main>

<script>
const ICONOS={botellon:"🫙",tapon:"🔵",sello:"🏷️"};
const POR_PAGINA=50;
let insumos=[];
let tipoActual="entrada";
let movimientosCargados=0;

window.onload=iniciar;

async function iniciar(){
    if(!await verificarSesion()) return;
    cambiarTipo("entrada");
    await cargarTodo();
}

async function verificarSesion(){
    const { data:sesion }=await supabaseClient.auth.getSession();
    if(!sesion.session){ location.href="login.html"; return false; }
    const { data:perfil,error }=await supabaseClient
        .from("usuarios").select("nombre,rol").eq("id",sesion.session.user.id).single();
    if(error || !perfil || perfil.rol!=="administrador"){
        alert("Acceso exclusivo para administradores.");
        location.href="menu.html";
        return false;
    }
    document.getElementById("nombreAdministrador").textContent=perfil.nombre || "Administrador";
    return true;
}

async function cargarTodo(){
    await cargarInsumos();
    await cargarMovimientos(true);
}

async function cargarInsumos(){
    const { data,error }=await supabaseClient
        .from("insumos").select("id,nombre,existencia,minimo").order("orden");
    if(error){
        document.getElementById("existencias").innerHTML=
            `<div class="tarjeta">No fue posible cargar el inventario: ${escapar(error.message)}</div>`;
        return;
    }
    insumos=data || [];
    mostrarExistencias();
    llenarSelects();
}

function mostrarExistencias(){
    document.getElementById("existencias").innerHTML=insumos.map(i=>{
        const bajo=i.minimo>0 && i.existencia<=i.minimo;
        const negativo=i.existencia<0;
        return `
        <article class="insumo ${bajo ? "bajo" : ""} ${negativo ? "en-negativo" : ""}">
            <div class="insumo-cabecera">
                <div class="insumo-icono">${ICONOS[i.id] || "📦"}</div>
                <span>${escapar(i.nombre)}</span>
            </div>
            <div class="cantidad">${formatoNumero(i.existencia)}</div>
            <div class="unidad">unidades en existencia</div>
            <span class="aviso-bajo">⚠️ Existencia baja</span>
            <span class="negativo">Haz un conteo físico para corregir</span>
            <div class="minimo">
                <span>Aviso cuando queden ${i.minimo>0 ? formatoNumero(i.minimo) + " o menos" : "— (sin aviso)"}</span>
                <button type="button" onclick="cambiarMinimo('${i.id}')">Cambiar</button>
            </div>
        </article>`;
    }).join("");
}

function llenarSelects(){
    const anterior=document.getElementById("insumo").value;
    const filtroAnterior=document.getElementById("filtroInsumo").value;
    const opciones=insumos.map(i=>`<option value="${i.id}">${escapar(i.nombre)}</option>`).join("");
    document.getElementById("insumo").innerHTML=opciones;
    document.getElementById("filtroInsumo").innerHTML=`<option value="">Todos los insumos</option>`+opciones;
    if(anterior) document.getElementById("insumo").value=anterior;
    document.getElementById("filtroInsumo").value=filtroAnterior;
}

function cambiarTipo(tipo){
    tipoActual=tipo;
    document.getElementById("tipoEntrada").classList.toggle("activo",tipo==="entrada");
    document.getElementById("tipoConteo").classList.toggle("activo",tipo==="conteo");
    document.getElementById("etiquetaCantidad").textContent=
        tipo==="entrada" ? "Cantidad que entra" : "Cantidad contada";
    document.getElementById("ayudaTipo").innerHTML=tipo==="entrada"
        ? "Usa <b>Entrada</b> cuando compras o recibes insumos. La cantidad se <b>suma</b> a la existencia."
        : "Usa <b>Conteo físico</b> cuando cuentas lo que hay en bodega. La existencia queda <b>igual a lo que contaste</b> y el sistema registra la diferencia.";
    mostrarMensaje("","");
}

async function guardarMovimiento(){
    const insumo=document.getElementById("insumo").value;
    const cantidad=Number(document.getElementById("cantidad").value);
    const nota=document.getElementById("nota").value.trim();
    const datos=insumos.find(i=>i.id===insumo);

    if(!insumo || !Number.isInteger(cantidad) || cantidad<0 || (tipoActual==="entrada" && cantidad===0)){
        mostrarMensaje("Escribe una cantidad válida (número entero).","error");
        return;
    }

    if(tipoActual==="conteo" && datos){
        const diferencia=cantidad-datos.existencia;
        const texto=diferencia===0
            ? "El conteo coincide con el sistema."
            : `El sistema tiene ${formatoNumero(datos.existencia)}. Se ${diferencia>0 ? "sumarán" : "restarán"} ${formatoNumero(Math.abs(diferencia))}.`;
        if(!confirm(`Conteo físico de ${datos.nombre}: ${formatoNumero(cantidad)}\n\n${texto}\n\n¿Guardar?`)) return;
    }

    const boton=document.getElementById("btnGuardar");
    boton.disabled=true;
    boton.textContent="Guardando...";

    const { error }=await supabaseClient.rpc("insumo_registrar",{
        p_insumo:insumo, p_tipo:tipoActual, p_cantidad:cantidad, p_nota:nota
    });

    boton.disabled=false;
    boton.textContent="💾 Guardar";

    if(error){
        mostrarMensaje("No se pudo guardar: "+error.message,"error");
        return;
    }

    document.getElementById("cantidad").value="";
    document.getElementById("nota").value="";
    mostrarMensaje(`✅ ${tipoActual==="entrada" ? "Entrada" : "Conteo"} de ${datos ? datos.nombre.toLowerCase() : "insumo"} guardado.`,"ok");
    await cargarTodo();
}

async function cambiarMinimo(id){
    const datos=insumos.find(i=>i.id===id);
    const respuesta=prompt(
        `¿Con cuántos ${datos.nombre.toLowerCase()} o menos quieres el aviso de existencia baja?\n(Escribe 0 para no tener aviso)`,
        String(datos.minimo || 0)
    );
    if(respuesta===null) return;
    const minimo=Number(respuesta.trim());
    if(!Number.isInteger(minimo) || minimo<0){
        alert("Escribe un número entero (0 o más).");
        return;
    }
    const { error }=await supabaseClient.rpc("insumo_definir_minimo",{ p_insumo:id, p_minimo:minimo });
    if(error){ alert("No se pudo guardar: "+error.message); return; }
    await cargarInsumos();
}

async function cargarMovimientos(reiniciar){
    if(reiniciar) movimientosCargados=0;
    const filtro=document.getElementById("filtroInsumo").value;
    let consulta=supabaseClient
        .from("insumo_movimientos")
        .select("id,insumo_id,tipo,cantidad,existencia_resultante,nota,usuario_nombre,created_at")
        .order("created_at",{ ascending:false })
        .range(movimientosCargados,movimientosCargados+POR_PAGINA-1);
    if(filtro) consulta=consulta.eq("insumo_id",filtro);

    const { data,error }=await consulta;
    const lista=document.getElementById("listaMovimientos");

    if(error){
        lista.innerHTML=`<div class="vacio"><div>⚠️</div>No fue posible cargar el historial: ${escapar(error.message)}</div>`;
        return;
    }

    const html=(data||[]).map(crearMovimiento).join("");
    if(reiniciar){
        lista.innerHTML=html || `<div class="vacio"><div>📦</div>Todavía no hay movimientos.<br>Empieza registrando un <b>conteo físico</b> de cada insumo.</div>`;
    }else{
        lista.insertAdjacentHTML("beforeend",html);
    }
    movimientosCargados+=(data||[]).length;
    document.getElementById("btnMas").hidden=(data||[]).length<POR_PAGINA;
}

function crearMovimiento(m){
    const nombre=(insumos.find(i=>i.id===m.insumo_id)||{}).nombre || m.insumo_id;
    const etiquetas={entrada:["Entrada","et-entrada"],conteo:["Conteo físico","et-conteo"],cierre:["Cierre de viaje","et-cierre"]};
    const [texto,clase]=etiquetas[m.tipo] || [m.tipo,""];
    const signo=m.cantidad>0 ? "+" : "";
    const color=m.cantidad>0 ? "suma" : (m.cantidad<0 ? "resta" : "cero");
    const fecha=new Date(m.created_at);
    return `
    <div class="mov">
        <div class="mov-fecha">${fecha.toLocaleDateString("es-HN",{day:"2-digit",month:"short",year:"numeric"})}<br>${fecha.toLocaleTimeString("es-HN",{hour:"numeric",minute:"2-digit"})}</div>
        <div class="mov-detalle">
            <strong><span class="etiqueta ${clase}">${texto}</span>${escapar(nombre)}</strong>
            <span>${escapar(m.nota || "")}${m.usuario_nombre ? (m.nota ? " · " : "") + "👤 " + escapar(m.usuario_nombre) : ""}</span>
        </div>
        <div class="mov-cantidad">
            <strong class="${color}">${signo}${formatoNumero(m.cantidad)}</strong>
            <span>quedan ${formatoNumero(m.existencia_resultante)}</span>
        </div>
    </div>`;
}

function mostrarMensaje(texto,tipo){
    const el=document.getElementById("mensaje");
    el.textContent=texto;
    el.className="mensaje "+(tipo||"");
}

function formatoNumero(n){ return Number(n||0).toLocaleString("es-HN"); }

function escapar(valor){
    return String(valor??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
</script>

<script>
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js"); }
</script>

</body>
</html>
