<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Nuevo cliente</title>

<link
rel="icon"
href="img/favicon_64.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f8fb;
    color:#1f2937;
}

header{
    background:#0077b6;
    color:white;
    padding:18px;
}

header h2{
    max-width:760px;
    margin:auto;
}

main{
    max-width:760px;
    margin:auto;
    padding:20px;
}

.tarjeta{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.campo{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.obligatorio{
    color:#c1121f;
}

input,
select,
button{
    width:100%;
    padding:13px;
    font-size:16px;
    border-radius:8px;
}

input,
select{
    border:1px solid #b8c2cc;
    background:white;
}

#nombre,
#identificacion,
#municipio,
#barrio,
#referencia{
    text-transform:uppercase;
}

#campoNombreNegocio{
    display:none;
    padding:14px;
    border:1px solid #f6c453;
    border-radius:10px;
    background:#fffbeb;
}

#campoNombreNegocio small{
    display:block;
    margin-top:8px;
    color:#92400e;
}

#nombreNegocio{
    text-transform:uppercase;
}

.fila{
    display:flex;
    gap:14px;
}

.fila .campo{
    flex:1;
}

button{
    border:none;
    background:#0077b6;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#005f92;
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.secundario{
    background:#667085;
}

.acciones{
    display:flex;
    gap:12px;
    margin-top:22px;
}

.estado{
    min-height:22px;
    margin-top:14px;
    text-align:center;
    font-weight:bold;
}

@media(max-width:620px){

    .fila,
    .acciones{
        flex-direction:column;
        gap:0;
    }

    .acciones{
        gap:10px;
    }

}

</style>

</head>

<body>

<header>
<h2>➕ Nuevo cliente</h2>
</header>

<main>

<div class="tarjeta">

<div class="campo">
<label for="nombre">
Nombre completo <span class="obligatorio">*</span>
</label>
<input id="nombre" autocomplete="name">
</div>

<div class="fila">

<div class="campo">
<label for="telefono">
Teléfono <span class="obligatorio">*</span>
</label>
<input id="telefono" inputmode="tel" autocomplete="tel">
</div>

<div class="campo">
<label for="identificacion">RTN o DNI</label>
<input id="identificacion" inputmode="numeric">
</div>

</div>

<div class="fila">

<div class="campo">
<label for="municipio">
Municipio <span class="obligatorio">*</span>
</label>
<input id="municipio">
</div>

<div class="campo">
<label for="barrio">
Barrio o aldea <span class="obligatorio">*</span>
</label>
<input id="barrio">
</div>

</div>

<div class="campo">
<label for="referencia">Referencia de la dirección</label>
<input
id="referencia"
placeholder="Ejemplo: casa azul frente a la escuela">
</div>

<div class="campo">
<label for="tipoCliente">Tipo de cliente</label>
<select id="tipoCliente" onchange="actualizarCampoNegocio()">
<option value="Cliente Final">👤 Cliente final</option>
<option value="Tienda">🏪 Tienda</option>
</select>
</div>

<div id="campoNombreNegocio" class="campo">
<label for="nombreNegocio">
Nombre del negocio <span class="obligatorio">*</span>
</label>
<input
id="nombreNegocio"
placeholder="Ejemplo: PULPERÍA LA BENDICIÓN">
<small>
La tienda quedará pendiente de configurar y activar en Mayoristas.
</small>
</div>

<button
type="button"
id="btnUbicacion"
onclick="obtenerUbicacion()">
📍 Obtener ubicación
</button>

<div class="acciones">

<button
type="button"
class="secundario"
onclick="volverFacturacion()">
← Cancelar
</button>

<button
type="button"
id="btnGuardar"
onclick="guardarCliente()">
💾 Guardar cliente
</button>

</div>

<div id="estado" class="estado"></div>

</div>

</main>

<script>

const SUPABASE_URL =
"https://ayzddkcxeswjfpinwvth.supabase.co";

const SUPABASE_KEY =
"sb_publishable_34T_1LZ8Brpa_3sq2vT_Ew_AIvOuTDl";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let latitudCliente=null;
let longitudCliente=null;
let guardando=false;

window.onload=verificarAdministrador;

document.addEventListener("input",evento=>{

    if(
        evento.target.matches(
            "#nombre, #identificacion, #municipio, " +
            "#barrio, #referencia, #nombreNegocio"
        )
    ){
        evento.target.value=
            evento.target.value.toLocaleUpperCase("es-HN");
    }

});

async function verificarAdministrador(){

    const { data } =
        await supabaseClient.auth.getSession();

    if(!data.session){
        location.href="login.html";
        return false;
    }

    const { data:perfil, error } =
        await supabaseClient
        .from("usuarios")
        .select("rol")
        .eq("id",data.session.user.id)
        .single();

    if(error || !perfil || perfil.rol!=="administrador"){

        alert("Acceso exclusivo para administradores.");
        location.href="menu.html";
        return false;

    }

    return true;

}

function volverFacturacion(){
    location.href="facturacion.html";
}

function actualizarCampoNegocio(){

    const esTienda=
        document.getElementById("tipoCliente").value==="Tienda";

    document.getElementById("campoNombreNegocio").style.display=
        esTienda ? "block" : "none";

    document.getElementById("nombreNegocio").required=esTienda;

}

function obtenerUbicacion(){

    if(!navigator.geolocation){
        alert("Este dispositivo no soporta GPS.");
        return;
    }

    const boton=document.getElementById("btnUbicacion");
    boton.disabled=true;
    boton.innerHTML="Obteniendo ubicación...";

    navigator.geolocation.getCurrentPosition(

        posicion=>{

            latitudCliente=posicion.coords.latitude;
            longitudCliente=posicion.coords.longitude;
            boton.innerHTML="✅ Ubicación registrada";

        },

        ()=>{

            boton.disabled=false;
            boton.innerHTML="📍 Obtener ubicación";
            alert("No fue posible obtener la ubicación.");

        },

        {
            enableHighAccuracy:true,
            timeout:10000
        }

    );

}

async function guardarCliente(){

    if(guardando){
        return;
    }

    const cliente={
        nombre:document.getElementById("nombre").value.trim(),
        telefono:document.getElementById("telefono").value.trim(),
        municipio:document.getElementById("municipio").value.trim(),
        barrio:document.getElementById("barrio").value.trim(),
        referencia:document.getElementById("referencia").value.trim(),
        identificacion:document.getElementById(
            "identificacion"
        ).value.trim(),
        tipo_cliente:document.getElementById("tipoCliente").value,
        latitud:latitudCliente,
        longitud:longitudCliente
    };

    const nombreNegocio=
        document.getElementById("nombreNegocio").value.trim();

    if(
        !cliente.nombre ||
        !cliente.telefono ||
        !cliente.municipio ||
        !cliente.barrio
    ){
        alert("Complete los campos obligatorios.");
        return;
    }

    if(cliente.tipo_cliente==="Tienda" && !nombreNegocio){

        alert("Ingrese el nombre del negocio.");
        document.getElementById("nombreNegocio").focus();
        return;

    }

    if(
        cliente.tipo_cliente==="Tienda" &&
        (latitudCliente===null || longitudCliente===null)
    ){

        alert(
            "Para registrar una tienda debe obtener su ubicación GPS."
        );

        document.getElementById("btnUbicacion").focus();
        return;

    }

    const boton=document.getElementById("btnGuardar");
    const estado=document.getElementById("estado");

    guardando=true;
    boton.disabled=true;
    boton.innerHTML="Guardando...";
    estado.innerHTML="";

    const { data, error } =
        await supabaseClient
        .from("clientes")
        .insert(cliente)
        .select("id")
        .single();

    if(error){

        console.error(error);
        estado.style.color="#c1121f";
        estado.innerHTML="No se pudo guardar: " + error.message;
        boton.disabled=false;
        boton.innerHTML="💾 Guardar cliente";
        guardando=false;
        return;

    }

    estado.style.color="#198754";
    estado.innerHTML="Cliente guardado correctamente.";

    if(cliente.tipo_cliente==="Tienda"){

        const { error:errorMayorista }=
            await supabaseClient
            .from("clientes_mayoristas")
            .insert({
                cliente_id:data.id,
                nombre_tienda:nombreNegocio,
                tipo_precio:"precio_pulperia_zona1",
                precio_botellon:0,
                activo:false
            });

        if(errorMayorista){

            console.error(errorMayorista);
            estado.style.color="#c1121f";
            estado.innerHTML=
                "El cliente fue guardado, pero no se pudo guardar " +
                "el negocio: " + errorMayorista.message;
            boton.disabled=false;
            boton.innerHTML="👥 Revisar cliente guardado";
            boton.onclick=()=>location.href="clientes.html";
            guardando=false;
            return;

        }

        location.href=
            "facturacion.html?tiendaPendiente=1";

    }else{

        location.href=
            "facturacion.html?cliente=" +
            encodeURIComponent(data.id);

    }

}

actualizarCampoNegocio();

</script>

</body>

</html>
