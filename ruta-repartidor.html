<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruta del día</title><link rel="icon" href="img/favicon_64.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--azul:#075985;--verde:#16a34a;--rojo:#dc2626;--texto:#102a43;--muted:#64748b;--borde:#dbe7ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--texto);background:#f5f9fc}header{padding:18px max(14px,calc((100% - 1200px)/2));color:#fff;background:linear-gradient(135deg,#064e6f,#0284c7)}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:clamp(25px,4vw,35px)}header p{margin:4px 0 0;color:#dff6ff}.volver{width:auto;padding:11px 15px;border:1px solid #ffffff55;background:#ffffff20;color:#fff;border-radius:11px;font-weight:800}.pagina{max-width:1200px;margin:auto;padding:16px 14px 60px}.superior{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:13px}.card{background:#fff;border:1px solid var(--borde);border-radius:17px;padding:16px;box-shadow:0 8px 25px #0f405b12}.ruta-selector select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;margin-top:7px}.perfil{text-align:right}.perfil strong{display:block;font-size:17px}.perfil span{color:var(--muted);font-size:14px}.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}.indicador{text-align:center}.indicador strong{display:block;font-size:26px}.indicador span{font-size:13px;color:var(--muted)}.mapa-layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.75fr);gap:13px}#mapa{height:620px;border-radius:17px;border:1px solid var(--borde);box-shadow:0 8px 25px #0f405b18}.panel{max-height:620px;overflow:auto}.panel h2{margin:0 0 12px}.parada{padding:13px;margin-bottom:9px;border:1px solid var(--borde);border-left:5px solid var(--verde);border-radius:13px;background:#fff;cursor:pointer}.parada.visitado{border-left-color:var(--rojo);background:#fff7f7}.parada.entregado{border-left-color:#2563eb;background:#eff6ff}.parada-head{display:flex;justify-content:space-between;gap:8px}.parada h3{margin:0;font-size:16px}.parada p{margin:6px 0 0;color:#64748b;font-size:13px}.numero{min-width:29px;height:29px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#075985;font-size:12px;font-weight:900}.leyenda{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px;font-size:12px}.leyenda span{display:flex;align-items:center;gap:5px}.punto{width:11px;height:11px;border-radius:50%}.botellon-marca{position:relative;width:37px;height:44px;border:3px solid #fff;border-radius:12px 12px 15px 15px;background:var(--verde);box-shadow:0 3px 8px #0005;color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900}.botellon-marca:before{content:"";position:absolute;top:-8px;width:15px;height:8px;border-radius:4px 4px 0 0;background:inherit}.botellon-marca.visitado{background:var(--rojo)}.botellon-marca.entregado{background:#2563eb}.popup h3{margin:0 0 7px}.popup p{margin:4px 0}.popup button{width:100%;padding:9px;margin-top:7px;border:0;border-radius:8px;color:#fff;font-weight:800;cursor:pointer}.popup .visitar{background:#dc2626}.popup .entregar{background:#2563eb}.popup .navegar{background:#075985}.finalizar{width:100%;padding:13px;border:0;border-radius:11px;color:#fff;background:linear-gradient(135deg,#047857,#059669);font-size:16px;font-weight:900;cursor:pointer}.vacio{text-align:center;padding:55px 18px;color:#64748b}.vacio div{font-size:45px}@media(max-width:850px){.mapa-layout{grid-template-columns:1fr}#mapa{height:52vh;min-height:390px}.panel{max-height:none}.resumen{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header{padding:16px 12px}.volver{font-size:0;width:45px}.volver:after{content:'←';font-size:22px}.pagina{padding:10px}.superior{grid-template-columns:1fr}.perfil{text-align:left}.card{padding:13px}.resumen{gap:7px}.indicador strong{font-size:22px}}
.ubicacion-btn{width:100%;padding:12px;margin:0 0 12px;border:1px solid #93c5fd;border-radius:11px;color:#1d4ed8;background:#eff6ff;font-size:14px;font-weight:900;cursor:pointer}.ubicacion-estado{display:block;margin:-5px 0 12px;text-align:center;color:#64748b;font-size:12px}.ubicacion-actual{width:24px;height:24px;border:4px solid #fff;border-radius:50%;background:#0ea5e9;box-shadow:0 0 0 7px #0ea5e944,0 3px 10px #0005;animation:pulso 1.8s infinite}@keyframes pulso{50%{box-shadow:0 0 0 13px #0ea5e911,0 3px 10px #0005}}
</style>
</head>
<body>
<header><div class="head"><div><h1>🚚 Ruta del día</h1><p id="fechaHoy">Preparando jornada...</p></div><button class="volver" onclick="location.href='menu.html'">← Menú</button></div></header>
<main class="pagina">
<div class="superior"><section class="card ruta-selector"><b>Ruta activa para hoy</b><select id="selectorRuta" onchange="seleccionarRuta()"><option>Cargando...</option></select></section><section class="card perfil"><strong id="nombreChofer">Cargando...</strong><span id="camionChofer"></span></section></div>
<section class="resumen"><div class="card indicador"><strong id="total">0</strong><span>Total</span></div><div class="card indicador"><strong id="pendientes" style="color:#16a34a">0</strong><span>Sin visitar</span></div><div class="card indicador"><strong id="visitados" style="color:#dc2626">0</strong><span>Visitados</span></div><div class="card indicador"><strong id="entregados" style="color:#2563eb">0</strong><span>Entregados</span></div></section>
<div id="contenidoRuta" class="mapa-layout"><div id="mapa"></div><aside class="card panel"><h2>Paradas</h2><div class="leyenda"><span><i class="punto" style="background:#16a34a"></i>Sin visitar</span><span><i class="punto" style="background:#dc2626"></i>Visitado</span><span><i class="punto" style="background:#2563eb"></i>Entregado</span><span><i class="punto" style="background:#0ea5e9"></i>Mi ubicación</span></div><button id="btnUbicacion" class="ubicacion-btn" onclick="mostrarMiUbicacion()">📡 Mostrar mi ubicación</button><span id="estadoUbicacion" class="ubicacion-estado">El navegador solicitará permiso para usar el GPS.</span><div id="listaParadas"></div><button id="btnFinalizar" class="finalizar" onclick="finalizarRuta()">✅ Finalizar ruta</button></aside></div>
</main>
<script>
const SUPABASE_URL="https://ayzddkcxeswjfpinwvth.supabase.co";const SUPABASE_KEY="sb_publishable_34T_1LZ8Brpa_3sq2vT_Ew_AIvOuTDl";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let usuario=null,perfil=null,rutas=[],rutaActual=null,jornada=null,paradas=[],mapa=null,marcadores=new Map();
let marcadorUbicacion=null,circuloPrecision=null,seguimientoId=null,ultimaUbicacion=null;
window.onload=iniciar;
async function iniciar(){const sesion=await cargarUsuario();if(!sesion)return;document.getElementById("fechaHoy").textContent=new Date().toLocaleDateString("es-HN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});await cargarRutasHoy()}
async function cargarUsuario(){const {data}=await supabaseClient.auth.getUser();if(!data.user){location.href="login.html";return false}usuario=data.user;const resultado=await supabaseClient.from("usuarios").select("nombre,rol,camion").eq("id",usuario.id).single();perfil=resultado.data;if(!perfil||!["chofer","administrador"].includes(perfil.rol)){alert("Acceso denegado.");location.href="menu.html";return false}document.getElementById("nombreChofer").textContent=perfil.nombre||"Usuario";document.getElementById("camionChofer").textContent=perfil.camion||"Sin camión asignado";return true}
async function cargarRutasHoy(){const dia=new Date().getDay();let consulta=supabaseClient.from("rutas").select("*").eq("activo",true).eq("dia_semana",dia).order("numero");if(perfil.rol==="chofer")consulta=consulta.eq("usuario_id",usuario.id);const {data,error}=await consulta;if(error){mostrarSinRuta(error.message.includes("rutas")?"El administrador debe ejecutar rutas.sql en Supabase.":error.message);return}rutas=data||[];const selector=document.getElementById("selectorRuta");selector.innerHTML=rutas.length?rutas.map(r=>`<option value="${r.id}">RUTA-${String(r.numero).padStart(4,"0")} · ${esc(r.municipio)}</option>`).join(""):'<option value="">No hay rutas programadas hoy</option>';if(!rutas.length){mostrarSinRuta("No tiene rutas activas asignadas para este día.");return}await seleccionarRuta()}
async function seleccionarRuta(){const id=document.getElementById("selectorRuta").value;rutaActual=rutas.find(r=>r.id===id);if(!rutaActual)return;await prepararJornada();await cargarParadas()}
async function prepararJornada(){const fecha=fechaLocal();const existente=await supabaseClient.from("ruta_jornadas").select("*").eq("ruta_id",rutaActual.id).eq("fecha",fecha).maybeSingle();if(existente.error){alert(existente.error.message);return}if(existente.data){jornada=existente.data;return}const usuarioJornada=rutaActual.usuario_id||usuario.id;const {data,error}=await supabaseClient.from("ruta_jornadas").insert({ruta_id:rutaActual.id,fecha,usuario_id:usuarioJornada}).select("*").single();if(error){alert(error.message);return}jornada=data}
async function cargarParadas(){if(!jornada)return;const rc=await supabaseClient.from("ruta_clientes").select("cliente_id,orden").eq("ruta_id",rutaActual.id).order("orden");if(rc.error){alert(rc.error.message);return}const ids=(rc.data||[]).map(x=>x.cliente_id);if(!ids.length){paradas=[];renderizar();return}const clientes=await supabaseClient.from("clientes").select("id,nombre,telefono,municipio,barrio,referencia,latitud,longitud").in("id",ids);if(clientes.error){alert(clientes.error.message);return}const visitas=await supabaseClient.from("ruta_visitas").select("*").eq("jornada_id",jornada.id);if(visitas.error){alert(visitas.error.message);return}const mapaClientes=new Map(clientes.data.map(c=>[c.id,c]));const mapaVisitas=new Map((visitas.data||[]).map(v=>[v.cliente_id,v]));const faltantes=[];paradas=rc.data.map(item=>{const cliente=mapaClientes.get(item.cliente_id);let visita=mapaVisitas.get(item.cliente_id);if(!visita){visita={jornada_id:jornada.id,cliente_id:item.cliente_id,orden:item.orden,estado:"pendiente"};faltantes.push(visita)}return {...cliente,orden:item.orden,visita}}).filter(p=>p.id);if(faltantes.length){const res=await supabaseClient.from("ruta_visitas").upsert(faltantes,{onConflict:"jornada_id,cliente_id"}).select();if(res.error){alert(res.error.message);return}const nuevas=new Map(res.data.map(v=>[v.cliente_id,v]));paradas.forEach(p=>{if(nuevas.has(p.id))p.visita=nuevas.get(p.id)})}renderizar()}
function renderizar(){actualizarResumen();renderizarLista();renderizarMapa();document.getElementById("btnFinalizar").disabled=jornada?.estado==="finalizada";document.getElementById("btnFinalizar").textContent=jornada?.estado==="finalizada"?"✓ Ruta finalizada":"✅ Finalizar ruta"}
function actualizarResumen(){const contar=e=>paradas.filter(p=>p.visita.estado===e).length;document.getElementById("total").textContent=paradas.length;document.getElementById("pendientes").textContent=contar("pendiente");document.getElementById("visitados").textContent=contar("visitado");document.getElementById("entregados").textContent=contar("entregado")}
function renderizarLista(){document.getElementById("listaParadas").innerHTML=paradas.length?paradas.map(p=>`<article class="parada ${p.visita.estado}" onclick="enfocar('${p.id}')"><div class="parada-head"><div><h3>${esc(p.nombre)}</h3><p>${esc(p.barrio||p.municipio||"")}</p></div><span class="numero">${p.orden}</span></div></article>`).join(""):'<div class="vacio"><div>👥</div>No hay clientes sincronizados.<br>El administrador debe presionar <b>Clientes</b> en esta ruta.</div>'}
function renderizarMapa(){if(mapa){mapa.remove();marcadores.clear();marcadorUbicacion=null;circuloPrecision=null}mapa=L.map("mapa").setView([Number(rutaActual.latitud),Number(rutaActual.longitud)],13);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(mapa);const puntos=[];paradas.forEach(p=>{if(!p.latitud||!p.longitud)return;const icono=L.divIcon({className:"",html:`<div class="botellon-marca ${p.visita.estado}">${p.orden}</div>`,iconSize:[37,44],iconAnchor:[18,44]});const marcador=L.marker([Number(p.latitud),Number(p.longitud)],{icon:icono}).addTo(mapa).bindPopup(popupParada(p),{maxWidth:270});marcadores.set(p.id,marcador);puntos.push([Number(p.latitud),Number(p.longitud)])});if(puntos.length)mapa.fitBounds(puntos,{padding:[30,30],maxZoom:15});if(ultimaUbicacion)dibujarUbicacion(ultimaUbicacion,false)}
function popupParada(p){const bloqueado=jornada.estado==="finalizada"?"disabled":"";return `<div class="popup"><h3>${esc(p.nombre)}</h3><p>📞 ${esc(p.telefono||"")}</p><p>📍 ${esc(p.barrio||"")} ${esc(p.referencia||"")}</p><button class="navegar" onclick="navegar(${Number(p.latitud)},${Number(p.longitud)})">🧭 Abrir navegación</button><button class="visitar" ${bloqueado} onclick="marcar('${p.id}','visitado')">🔴 Marcar visitado</button><button class="entregar" ${bloqueado} onclick="marcar('${p.id}','entregado')">🔵 Marcar entregado</button></div>`}
async function marcar(clienteId,estado){const p=paradas.find(x=>x.id===clienteId);if(!p||jornada.estado==="finalizada")return;const {error}=await supabaseClient.from("ruta_visitas").update({estado,visitado_at:new Date().toISOString(),visitado_por:usuario.id}).eq("id",p.visita.id);if(error){alert(error.message);return}p.visita.estado=estado;mapa.closePopup();renderizar()}
function enfocar(id){const marcador=marcadores.get(id);if(marcador){mapa.setView(marcador.getLatLng(),16);marcador.openPopup()}}
function navegar(lat,lng){window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,"_blank")}
function mostrarMiUbicacion(){if(!navigator.geolocation){alert("Este dispositivo no soporta ubicación GPS.");return}if(ultimaUbicacion){mapa.setView([ultimaUbicacion.latitud,ultimaUbicacion.longitud],17);return}document.getElementById("btnUbicacion").textContent="📡 Buscando ubicación...";document.getElementById("estadoUbicacion").textContent="Active la ubicación precisa si el teléfono lo solicita.";seguimientoId=navigator.geolocation.watchPosition(posicion=>{ultimaUbicacion={latitud:posicion.coords.latitude,longitud:posicion.coords.longitude,precision:posicion.coords.accuracy};dibujarUbicacion(ultimaUbicacion,!marcadorUbicacion)},error=>{document.getElementById("btnUbicacion").textContent="📡 Intentar nuevamente";document.getElementById("estadoUbicacion").textContent=error.code===1?"Permiso de ubicación denegado.":"No fue posible obtener la ubicación."},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})}
function dibujarUbicacion(ubicacion,centrar){if(!mapa)return;const punto=[ubicacion.latitud,ubicacion.longitud];if(!marcadorUbicacion){const icono=L.divIcon({className:"",html:'<div class="ubicacion-actual"></div>',iconSize:[24,24],iconAnchor:[12,12]});marcadorUbicacion=L.marker(punto,{icon:icono,zIndexOffset:1000}).addTo(mapa).bindPopup("📡 Usted está aquí");circuloPrecision=L.circle(punto,{radius:ubicacion.precision||10,color:"#0ea5e9",fillColor:"#38bdf8",fillOpacity:.12,weight:1}).addTo(mapa)}else{marcadorUbicacion.setLatLng(punto);circuloPrecision.setLatLng(punto).setRadius(ubicacion.precision||10)}document.getElementById("btnUbicacion").textContent="🎯 Centrar en mi ubicación";document.getElementById("estadoUbicacion").textContent=`Precisión aproximada: ${Math.round(ubicacion.precision||0)} metros`;if(centrar)mapa.setView(punto,17)}
async function finalizarRuta(){const pendientes=paradas.filter(p=>p.visita.estado==="pendiente").length;const mensaje=pendientes?`Todavía quedan ${pendientes} paradas sin visitar. ¿Finalizar de todos modos?`:"¿Confirmar que terminó esta ruta?";if(!confirm(mensaje))return;const {error}=await supabaseClient.from("ruta_jornadas").update({estado:"finalizada",finalizada_at:new Date().toISOString()}).eq("id",jornada.id);if(error){alert(error.message);return}jornada.estado="finalizada";renderizar();alert("Ruta finalizada correctamente.")}
function mostrarSinRuta(mensaje){document.getElementById("contenidoRuta").innerHTML=`<div class="card vacio" style="grid-column:1/-1"><div>🗓️</div><h2>Sin ruta para hoy</h2><p>${esc(mensaje)}</p></div>`}
function fechaLocal(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script>
</body>
</html>
