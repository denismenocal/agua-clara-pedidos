<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Gestión de Clientes</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color"
      content="#0077b6">

<link rel="icon"
      href="img/favicon_64.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --azul:#075985;
    --celeste:#0ea5e9;
    --verde:#059669;
    --rojo:#dc2626;
    --texto:#102a43;
    --muted:#64748b;
    --borde:#dbe7ef;
}

*{box-sizing:border-box;}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    color:var(--texto);
    background:linear-gradient(180deg,#dcf4f5 0,#f5f9fc 300px);
    margin:0;
    min-height:100vh;
}

.cabecera{
    color:white;
    background:linear-gradient(135deg,#064e6f,#0284c7);
    padding:22px max(18px,calc((100% - 1180px)/2));
    box-shadow:0 8px 28px rgba(7,89,133,.22);
}

.cabecera-contenido{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.cabecera h1{margin:0;font-size:clamp(26px,4vw,37px);}
.cabecera p{margin:5px 0 0;color:#dff6ff;}
.menu{display:flex;gap:9px;}

.pagina{max-width:1180px;margin:auto;padding:22px 16px 70px;}
.distribucion{display:grid;grid-template-columns:minmax(320px,410px) 1fr;gap:18px;align-items:start;}

.tarjeta{
    background:rgba(255,255,255,.97);
    border:1px solid rgba(219,231,239,.9);
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(15,64,91,.08);
}
.formulario{position:sticky;top:16px;}
.titulo-seccion{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
.titulo-seccion h2{font-size:21px;margin:0;color:var(--texto);}
.titulo-seccion p{margin:4px 0 0;color:var(--muted);font-size:14px;}

label{display:block;margin:2px 0 6px;font-size:14px;font-weight:700;color:#334155;}
.campo-doble{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

input,select,button{
    width:100%;
    padding:13px 14px;
    margin-bottom:12px;
    font-size:16px;
    border-radius:11px;
}
input,select{border:1px solid #cbd5e1;background:#fff;color:var(--texto);}
input:focus,select:focus{outline:3px solid rgba(14,165,233,.15);border-color:var(--celeste);}

button{
    border:none;
    color:white;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(135deg,#0369a1,#0284c7);
    transition:transform .15s,box-shadow .15s,opacity .15s;
}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 7px 18px rgba(2,132,199,.22);}
button:disabled{opacity:.65;cursor:not-allowed;}
.menu button{width:auto;margin:0;padding:11px 15px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);}
.btn-guardar{min-height:52px;background:linear-gradient(135deg,#047857,#059669);}
.btn-secundario{background:#eff6ff;color:#075985;border:1px solid #bae6fd;}
.btn-cancelar-edicion{display:none;background:white;color:#b91c1c;border:1px solid #fecaca;}

.herramientas{display:flex;align-items:center;gap:12px;margin-bottom:15px;}
.herramientas input{margin:0;}
.contador{white-space:nowrap;padding:10px 13px;border-radius:999px;background:#e0f2fe;color:#075985;font-weight:800;}

#listaClientes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;}
.cliente{
    background:white;
    padding:17px;
    border:1px solid var(--borde);
    border-radius:16px;
    box-shadow:0 5px 16px rgba(15,64,91,.06);
}
.cliente-cabecera{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
.cliente h3{margin:0;font-size:18px;line-height:1.25;}
.tipo{padding:6px 9px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:12px;font-weight:800;white-space:nowrap;}
.tipo.tienda{background:#fef3c7;color:#92400e;}
.tipo.delivery{background:#dcfce7;color:#166534;}
.datos-cliente{display:grid;gap:8px;margin-bottom:15px;color:#475569;font-size:14px;}
.dato{display:flex;gap:8px;align-items:flex-start;}
.dato span:first-child{width:20px;text-align:center;}
.botones{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.botones button{margin:0;padding:10px 7px;font-size:13px;}
.botones .eliminar{background:#fff1f2;color:#be123c;border:1px solid #fecdd3;}
.botones .mapa{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;}
.vacio{grid-column:1/-1;text-align:center;padding:45px 20px;color:var(--muted);background:#f8fafc;border:1px dashed #cbd5e1;border-radius:16px;}

@media(max-width:900px){
    .distribucion{grid-template-columns:1fr;}
    .formulario{position:static;}
}

@media(max-width:620px){
    .cabecera{padding:18px 14px;}
    .cabecera-contenido{align-items:flex-start;}
    .cabecera p{font-size:13px;}
    .menu button{font-size:0;width:44px;padding:11px 7px;}
    .menu button:first-child::after{content:"🏠";font-size:19px;}
    .menu button:last-child::after{content:"🚪";font-size:19px;}
    .pagina{padding:14px 10px 50px;}
    .tarjeta{padding:16px;border-radius:17px;}
    .campo-doble{grid-template-columns:1fr;gap:0;}
    #listaClientes{grid-template-columns:1fr;}
    .herramientas{align-items:stretch;flex-direction:column;}
    .contador{text-align:center;}
}

</style>

</head>

<body>

<header class="cabecera">
<div class="cabecera-contenido">
<div>
<h1>👥 Gestión de clientes</h1>
<p>Registre, consulte y mantenga actualizada la información de sus clientes.</p>
</div>
<div class="menu">
<button onclick="location.href='menu.html'">🏠 Menú</button>
<button onclick="cerrarSesion()">🚪 Salir</button>
</div>
</div>
</header>

<main class="pagina">
<div class="distribucion">

<section class="tarjeta formulario">
<div class="titulo-seccion">
<div>
<h2 id="tituloFormulario">➕ Nuevo cliente</h2>
<p>Complete los datos marcados como obligatorios.</p>
</div>
</div>

<label for="nombre">Nombre completo *</label>
<input id="nombre" placeholder="Ej. MARÍA LÓPEZ" autocomplete="name">

<div class="campo-doble">
<div>
<label for="telefono">Teléfono *</label>
<input id="telefono" placeholder="Ej. 9999-9999" inputmode="tel" autocomplete="tel">
</div>
<div>
<label for="identificacion">RTN o DNI</label>
<input id="identificacion" placeholder="Identificación">
</div>
</div>

<div class="campo-doble">
<div>
<label for="municipio">Municipio *</label>
<input id="municipio" placeholder="Municipio">
</div>
<div>
<label for="barrio">Barrio o aldea *</label>
<input id="barrio" placeholder="Barrio o aldea">
</div>
</div>

<label for="referencia">Referencia de ubicación</label>
<input id="referencia" placeholder="Casa, color o punto de referencia">

<label for="tipo_cliente">Tipo de cliente</label>
<select id="tipo_cliente">

<option value="Delivery">
🚚 Delivery
</option>

<option value="Tienda">
🏪 Tienda
</option>

<option value="Cliente Final">
👤 Cliente Final
</option>

</select>

<button
type="button"
id="btnUbicacion"
class="btn-secundario"
onclick="obtenerUbicacion()">

📍 Obtener ubicación

</button>

<button
id="btnGuardar"
class="btn-guardar"
onclick="guardarCliente()">

💾 Guardar Cliente

</button>

<button id="btnCancelarEdicion" class="btn-cancelar-edicion" onclick="limpiarFormulario()">
✕ Cancelar edición
</button>

</section>

<section class="tarjeta">
<div class="titulo-seccion">
<div>
<h2>Directorio de clientes</h2>
<p>Busque por nombre o número de teléfono.</p>
</div>
</div>

<div class="herramientas">
<input id="buscar" placeholder="🔍 Buscar cliente..." oninput="filtrarClientes()">
<span id="contadorClientes" class="contador">0 clientes</span>
</div>

<div id="listaClientes"></div>
</section>

</div>
</main>

<script>

const SUPABASE_URL =
"https://ayzddkcxeswjfpinwvth.supabase.co";

const SUPABASE_KEY =
"sb_publishable_34T_1LZ8Brpa_3sq2vT_Ew_AIvOuTDl";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

      async function verificarSesion(){

    const { data } =
        await supabaseClient.auth.getSession();

    if(!data.session){

        window.location.href="login.html";
        return;

    }

}

async function cerrarSesion(){

    await supabaseClient.auth.signOut();

    window.location.href="login.html";

}

async function cargarClientes(){

    const { data,error } =
        await supabaseClient
        .from("clientes")
        .select("*")
        .order("nombre");

    if(error){

        alert(error.message);
        return;

    }

    listaClientes = data;

    mostrarClientes(data);

}

function mostrarClientes(clientes){

    let html="";

    clientes.forEach(cliente=>{

        const tipo=cliente.tipo_cliente || "Cliente Final";

        const claseTipo=
            tipo==="Tienda"
            ? "tienda"
            : tipo==="Delivery"
            ? "delivery"
            : "";

        html += `

<div class="cliente">

<div class="cliente-cabecera">
<h3>${escaparHTML(cliente.nombre)}</h3>
<span class="tipo ${claseTipo}">${escaparHTML(tipo)}</span>
</div>

<div class="datos-cliente">
<div class="dato"><span>📞</span><span>${escaparHTML(cliente.telefono)}</span></div>
<div class="dato"><span>🏘️</span><span>${escaparHTML(cliente.municipio || "Sin municipio")}</span></div>
<div class="dato"><span>📍</span><span>${escaparHTML(cliente.barrio || "Sin barrio")}</span></div>
</div>

<div class="botones">

<button
onclick="editarCliente('${cliente.id}')">
✏️ Editar
</button>

<button
class="eliminar"
onclick="eliminarCliente('${cliente.id}')">
🗑️ Eliminar
</button>

<button
class="mapa"
onclick="abrirMapa(${cliente.latitud ?? "null"},${cliente.longitud ?? "null"})">
📍 Mapa
</button>

</div>

</div>

`;

    });

    if(clientes.length===0){
        html=`
            <div class="vacio">
                <div style="font-size:38px;margin-bottom:8px;">🔎</div>
                <b>No encontramos clientes</b>
                <div>Pruebe con otro nombre o número.</div>
            </div>
        `;
    }

    document.getElementById(
        "listaClientes"
    ).innerHTML=html;

    document.getElementById("contadorClientes").textContent=
        clientes.length===1
        ? "1 cliente"
        : `${clientes.length} clientes`;

}

function escaparHTML(valor){

    return String(valor ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function filtrarClientes(){

    const texto =
        document.getElementById("buscar")
        .value
        .toLowerCase();

    const filtrados =
        listaClientes.filter(c=>

            c.nombre.toLowerCase().includes(texto)

            ||

            c.telefono.includes(texto)

        );

    mostrarClientes(filtrados);

}

async function guardarCliente(){

    const boton=document.getElementById("btnGuardar");

    if(boton.disabled) return;

    const cliente={

        nombre:
        document.getElementById("nombre").value.trim(),

        telefono:
        document.getElementById("telefono").value.trim(),

        municipio:
        document.getElementById("municipio").value.trim(),

        barrio:
        document.getElementById("barrio").value.trim(),

        referencia:
        document.getElementById("referencia").value.trim(),

        identificacion:
        document.getElementById("identificacion").value.trim(),

        tipo_cliente:
        document.getElementById("tipo_cliente").value,

          latitud: latitudCliente,
          longitud: longitudCliente

    };

    if(

        !cliente.nombre ||

        !cliente.telefono ||

        !cliente.municipio ||

        !cliente.barrio

    ){

        alert("Complete los campos obligatorios.");
        return;

    }

    let error;

    boton.disabled=true;
    boton.textContent=clienteEditando
        ? "Actualizando..."
        : "Guardando...";

    if(clienteEditando){

        ({error}=await supabaseClient

        .from("clientes")

        .update(cliente)

        .eq("id",clienteEditando));

    }else{

        ({error}=await supabaseClient

        .from("clientes")

        .insert([cliente]));

    }

    if(error){

        alert(error.message);
        boton.disabled=false;
        boton.innerHTML=clienteEditando
            ? "💾 Actualizar Cliente"
            : "💾 Guardar Cliente";
        return;

    }

    limpiarFormulario();

    await cargarClientes();

    alert("Cliente guardado correctamente.");

}

function editarCliente(id){

    const cliente=
        listaClientes.find(c=>c.id===id);

    if(!cliente) return;

    clienteEditando=id;

    document.getElementById("nombre").value=
    cliente.nombre;

    document.getElementById("telefono").value=
    cliente.telefono;

    document.getElementById("municipio").value=
    cliente.municipio || "";

    document.getElementById("barrio").value=
    cliente.barrio || "";

    document.getElementById("referencia").value=
    cliente.referencia || "";

    document.getElementById("identificacion").value=
    cliente.identificacion || "";

    document.getElementById("tipo_cliente").value=
    cliente.tipo_cliente;

      latitudCliente = cliente.latitud;
longitudCliente = cliente.longitud;

const btnUbicacion =
    document.getElementById("btnUbicacion");

if(cliente.latitud && cliente.longitud){

    btnUbicacion.disabled = true;

    btnUbicacion.innerHTML =
    "✅ Ubicación registrada";

    btnUbicacion.style.background =
    "#28a745";

}else{

    btnUbicacion.disabled = false;

    btnUbicacion.innerHTML =
    "📍 Obtener ubicación";

    btnUbicacion.style.background =
    "#0077b6";

}

    document.getElementById(
        "btnGuardar"
    ).innerHTML=
    "💾 Actualizar Cliente";

    document.getElementById("tituloFormulario").textContent=
        "✏️ Editar cliente";

    document.getElementById("btnCancelarEdicion").style.display=
        "block";

    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}

async function eliminarCliente(id){

    if(
        !confirm(
            "¿Eliminar este cliente?"
        )
    ) return;

    const { error } =
        await supabaseClient

        .from("clientes")

        .delete()

        .eq("id",id);

    if(error){

        alert(error.message);
        return;

    }

    cargarClientes();

}

function abrirMapa(lat,long){

    if(!lat || !long){

        alert(
            "Este cliente no tiene ubicación."
        );

        return;

    }

    window.open(

`https://www.google.com/maps?q=${lat},${long}`,

"_blank"

);

}

function limpiarFormulario(){

    document.getElementById("nombre").value="";

    document.getElementById("telefono").value="";

    document.getElementById("municipio").value="";

    document.getElementById("barrio").value="";

    document.getElementById("referencia").value="";

    document.getElementById("identificacion").value="";

    document.getElementById("tipo_cliente").selectedIndex=0;

    document.getElementById("btnGuardar").innerHTML=

    "💾 Guardar Cliente";

    document.getElementById("btnGuardar").disabled=false;

    document.getElementById("tituloFormulario").textContent=
        "➕ Nuevo cliente";

    document.getElementById("btnCancelarEdicion").style.display=
        "none";

    clienteEditando=null;

      latitudCliente = null;
      longitudCliente = null;

const boton =
    document.getElementById(
        "btnUbicacion"
    );

boton.disabled = false;

boton.innerHTML =
"📍 Obtener ubicación";

      const btnUbicacion =
document.getElementById(
    "btnUbicacion"
);

btnUbicacion.disabled = false;

btnUbicacion.innerHTML =
"📍 Obtener ubicación";

btnUbicacion.style.background =
"#0077b6";

}

function obtenerUbicacion(){

    if(!navigator.geolocation){

        alert("Este dispositivo no soporta GPS.");
        return;

    }

    navigator.geolocation.getCurrentPosition(

        function(posicion){

            latitudCliente =
                posicion.coords.latitude;

            longitudCliente =
                posicion.coords.longitude;

            const boton =
                document.getElementById(
                    "btnUbicacion"
                );

            boton.innerHTML =
"✅ Ubicación registrada";

boton.disabled = true;

boton.style.background =
"#28a745";

        },

        function(){

            alert(
                "No fue posible obtener la ubicación."
            );

        },

        {

            enableHighAccuracy:true,
            timeout:10000

        }

    );

}

verificarSesion();

cargarClientes();

let clienteEditando = null;
let listaClientes = [];

let latitudCliente = null;
let longitudCliente = null;

["nombre","municipio","barrio","referencia"].forEach(id=>{

    document.getElementById(id).addEventListener("input",evento=>{
        const inicio=evento.target.selectionStart;
        evento.target.value=evento.target.value.toUpperCase();
        evento.target.setSelectionRange(inicio,inicio);
    });

});

</script>

</body>

</html>
