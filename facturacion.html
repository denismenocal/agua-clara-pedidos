<!DOCTYPE html>

<head>

<meta charset="UTF-8">

body{

<body>

readonly>

readonly>

readonly>

id="precioBotellon"
readonly>

<button
id="btnGuardarFactura"
onclick="guardarFactura()">

💾 Guardar Factura

</button>

</div>

<button

🖨 Imprimir

</button>

onclick="cancelarFactura()">

❌ Cancelar

</button>

</div>

</div>


    <script>

const SUPABASE_URL =
"https://ayzddkcxeswjfpinwvth.supabase.co";

const SUPABASE_KEY =
"sb_publishable_34T_1LZ8Brpa_3sq2vT_Ew_AIvOuTDl";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);
        let configuracion = {};
        let productoSeleccionado = null;
        let productos = [];
        let venta = {

    cliente:null,

    mayorista:null,

    tipoPrecio:null,

    precioBotellon:0,

    productos:[]

};

let empresa={};

let cai={};

let facturaGuardada=null;

let guardandoFactura=false;

window.onload = async()=>{

    await cargarEmpresa();

    await cargarCAI();

    await cargarConfiguracion();

    await cargarClientes();

    await cargarProductos();

    const parametros = new URLSearchParams(
        window.location.search
    );

    const clienteNuevo = parametros.get("cliente");

    const tiendaPendiente = parametros.get(
        "tiendaPendiente"
    );

    if(clienteNuevo){

        await seleccionarCliente(clienteNuevo);

        history.replaceState(
            {},
            "",
            "facturacion.html"
        );

    }

    if(tiendaPendiente){

        alert(
            "La tienda fue guardada, pero debe configurarse y " +
            "activarse en Mayoristas antes de facturarle."
        );

        history.replaceState(
            {},
            "",
            "facturacion.html"
        );

    }

}



        async function cargarEmpresa(){

    const { data,error } =
    await supabaseClient

    .from("empresa")

    .select("*")

    .single();

    if(error){

        alert(error.message);

        return;

    }

    empresa=data;

}


        async function cargarCAI(){

    const { data,error } =
    await supabaseClient

    .from("cai_facturacion")

    .select("*")

    .eq("activo",true)

    .single();

    if(error){

        alert(error.message);

        return;

    }

    cai=data;

const numeroFactura =
    cai.prefijo +
    String(cai.numero_actual).padStart(8,"0");

document.getElementById(
    "numeroFactura"
).value = numeroFactura;

document.getElementById(
    "fechaFactura"
).value =
new Date().toLocaleDateString();

document.getElementById(
    "cai"
).value = cai.cai;

document.getElementById(
    "vence"
).value = cai.fecha_limite;

}

        async function cargarClientes(){

    const { data,error } =
        await supabaseClient

        .from("clientes")

        .select("*")

        .order("nombre");

    if(error){

        alert(error.message);
        return;

    }

    const { data:mayoristasActivos, error:errorMayoristas } =
        await supabaseClient
        .from("clientes_mayoristas")
        .select("cliente_id")
        .eq("activo",true);

    if(errorMayoristas){

        alert(errorMayoristas.message);
        return;

    }

    const tiendasActivas = new Set(
        mayoristasActivos.map(item=>item.cliente_id)
    );

    listaClientes = data.filter(cliente=>
        cliente.tipo_cliente!=="Tienda" ||
        tiendasActivas.has(cliente.id)
    );

}

        function buscarCliente(){

    const texto =
        document
        .getElementById("buscarCliente")
        .value
        .toLowerCase();

    if(texto.length<2){

        document.getElementById(
            "resultadoBusqueda"
        ).innerHTML="";

        return;

    }

    const encontrados =
        listaClientes.filter(c=>

            c.nombre
            .toLowerCase()
            .includes(texto)

            ||

            c.telefono
            .includes(texto)

        );

    let html="";

    encontrados.forEach(cliente=>{

        html+=`

<div

onclick="seleccionarCliente('${cliente.id}')"

style="

padding:10px;

border-bottom:1px solid #ddd;

cursor:pointer;

background:white;

">

<b>

${cliente.nombre}

</b>

<br>

${cliente.telefono}

</div>

`;

    });

    document.getElementById(
        "resultadoBusqueda"
    ).innerHTML=html;

}

        async function seleccionarCliente(id){

    clienteSeleccionado =
        listaClientes.find(c=>c.id===id);

    if(!clienteSeleccionado){
        alert(
            "Este cliente no está disponible para facturación."
        );
        return;
    }

    if(clienteSeleccionado.tipo_cliente==="Tienda"){

        const { data:configuracionTienda, error } =
            await supabaseClient
            .from("clientes_mayoristas")
            .select("id")
            .eq("cliente_id",clienteSeleccionado.id)
            .eq("activo",true)
            .maybeSingle();

        if(error || !configuracionTienda){

            alert(
                "Esta tienda está pendiente de configurar o inactiva."
            );
            return;

        }

    }

    document.getElementById(
        "nombreCliente"
    ).value =
    clienteSeleccionado.nombre;

    document.getElementById(
        "rtnCliente"
    ).value =
    clienteSeleccionado.identificacion || "";

    document.getElementById(
        "direccionCliente"
    ).value =
    clienteSeleccionado.barrio || "";

    document.getElementById(
        "buscarCliente"
    ).value =
    clienteSeleccionado.nombre;

    document.getElementById(
        "resultadoBusqueda"
    ).innerHTML="";

await cargarDatosComerciales(
    clienteSeleccionado);

}

        function seleccionarConsumidorFinal(){

    clienteSeleccionado={
        id:null,
        nombre:"CONSUMIDOR FINAL",
        identificacion:"99999999999999",
        barrio:"",
        tipo_cliente:"Cliente Final"
    };

    venta.cliente=clienteSeleccionado;
    venta.mayorista=null;
    venta.tipoPrecio="precio_publico_zona1";
    venta.precioBotellon=Number(
        configuracion.precio_publico_zona1 || 0
    );

    document.getElementById("buscarCliente").value=
        "CONSUMIDOR FINAL";

    document.getElementById("resultadoBusqueda").innerHTML="";

    document.getElementById("nombreCliente").value=
        "CONSUMIDOR FINAL";

    document.getElementById("rtnCliente").value=
        "99999999999999";

    document.getElementById("direccionCliente").value="";

    document.getElementById("tipoCliente").value=
        "Cliente Final";

    document.getElementById("nombreComercial").value="";

    document.getElementById("tipoPrecio").value=
        "Público por zona";

    document.getElementById("precioBotellon").value=
        "Según producto";

}

        async function cargarDatosComerciales(cliente){

    venta.cliente = cliente;

    const { data: mayorista } =
        await supabaseClient

        .from("clientes_mayoristas")

        .select("*")

        .eq("cliente_id",cliente.id)

        .eq("activo",true)

        .maybeSingle();

    if(mayorista){

        venta.mayorista = mayorista;

        venta.tipoPrecio =
            mayorista.tipo_precio;

        venta.precioBotellon =
            Number(
                mayorista.precio_botellon
            );

        document.getElementById(
            "tipoCliente"
        ).value = "Tienda";

        document.getElementById(
            "nombreComercial"
        ).value =
        mayorista.nombre_tienda;

        document.getElementById(
            "tipoPrecio"
        ).value =
        mayorista.tipo_precio;

        document.getElementById(
            "precioBotellon"
        ).value =
        "L " +
        venta.precioBotellon.toFixed(2);

    }else{

        venta.mayorista = null;

        venta.tipoPrecio =
            "precio_publico_zona1";

        venta.precioBotellon =
            Number(
                configuracion.precio_publico_zona1
            );

        document.getElementById(
            "tipoCliente"
        ).value =
        "Cliente Final";

        document.getElementById(
            "nombreComercial"
        ).value = "";

        document.getElementById(
            "tipoPrecio"
        ).value =
        "Público por zona";

        document.getElementById(
            "precioBotellon"
        ).value =
        "Según producto";

    }

}

        async function cargarProductos(){

    const { data, error } =
        await supabaseClient

        .from("productos")

        .select("*")

        .eq("activo", true)

        .order("nombre");

    if(error){

        alert(error.message);
        return;

    }

    productos = data;

    mostrarProductos();

}

        function mostrarProductos(){

    let html = "";

    productos.forEach(producto=>{

        html += `

<button

style="
flex:1;
min-width:180px;
height:90px;
font-size:20px;
"

onclick="pedirCantidad('${producto.id}')">

${producto.nombre}

</button>

`;

    });

    document.getElementById(
        "listaProductos"
    ).innerHTML = html;

}

        function pedirCantidad(id){

    productoSeleccionado =
        productos.find(p=>p.id===id);

    document.getElementById(
        "tituloProducto"
    ).innerHTML =
    productoSeleccionado.nombre;

    let precio = 0;

    if(
        productoSeleccionado.nombre
        .toLowerCase()
        .includes("botell")
    ){

        if(venta.mayorista){

            precio=venta.precioBotellon;

        }else{

            precio=Number(
                configuracion[
                    productoSeleccionado.precio_configuracion
                ] ?? venta.precioBotellon ?? 0
            );

        }

    }else{

        precio =
        Number(
            configuracion[
                productoSeleccionado.precio_configuracion
            ] || 0
        );

    }

    productoSeleccionado.precioVenta =
        precio;

    document.getElementById(
        "precioProducto"
    ).innerHTML =
    "L " +
    precio.toFixed(2);

    document.getElementById(
        "cantidadProducto"
    ).value = 1;

    calcularSubtotalProducto();

    document.getElementById(
        "modalCantidad"
    ).style.display =
    "flex";

}

        function calcularSubtotalProducto(){

    const cantidad =
        Number(
            document.getElementById(
                "cantidadProducto"
            ).value
        );

    const subtotal =
        cantidad *
        productoSeleccionado.precioVenta;

    document.getElementById(
        "subtotalProducto"
    ).innerHTML =
    "Subtotal: L " +
    subtotal.toFixed(2);

}

        function cerrarModal(){

    document.getElementById(
        "modalCantidad"
    ).style.display =
    "none";

}

        function agregarProductoFactura(){

    const cantidad =
        Number(
            document.getElementById(
                "cantidadProducto"
            ).value
        );

    venta.productos.push({

        id:productoSeleccionado.id,

        nombre:productoSeleccionado.nombre,

        cantidad,

        precio:
        productoSeleccionado.precioVenta,

        total:
        cantidad *
        productoSeleccionado.precioVenta

    });

    cerrarModal();

    actualizarDetalle();

}

        async function cargarConfiguracion(){

    const { data, error } =
        await supabaseClient

        .from("configuracion")

        .select("*");

    if(error){

        alert(error.message);

        return;

    }

    configuracion = {};

    data.forEach(item=>{

        configuracion[item.clave] =
            Number(item.valor);

    });

}

        function actualizarDetalle(){

    let html="";

    let subtotal=0;

    venta.productos.forEach((item,index)=>{

        subtotal+=item.total;

        html+=`

<tr>

<td>

${item.nombre}

</td>

<td>

${item.cantidad}

</td>

<td>

L ${item.precio.toFixed(2)}

</td>

<td>

L ${item.total.toFixed(2)}

</td>

<td>

<button

onclick="eliminarProducto(${index})">

🗑

</button>

</td>

</tr>

`;

    });

    document.getElementById(
        "detalleFactura"
    ).innerHTML=html;

    actualizarTotales(subtotal);

}

        function eliminarProducto(indice){

    venta.productos.splice(
        indice,
        1
    );

    actualizarDetalle();

}


        function actualizarTotales(subtotal){

    const isv=0;

    const total=
        subtotal+isv;

    document.getElementById(
        "subtotal"
    ).innerHTML=
    "L "+
    subtotal.toFixed(2);

    document.getElementById(
        "isv"
    ).innerHTML=
    "L "+
    isv.toFixed(2);

    document.getElementById(
        "total"
    ).innerHTML=
    "L "+
    total.toFixed(2);

}

        function obtenerTotales(){

    const subtotal = venta.productos.reduce(
        (acumulado,item)=>acumulado + Number(item.total),
        0
    );

    const isv = 0;
    const descuento = 0;

    return {
        subtotal,
        isv,
        descuento,
        total:subtotal + isv - descuento
    };

}

        async function guardarFactura(){

    if(guardandoFactura || facturaGuardada){
        return;
    }

    if(
        !venta.cliente ||
        !document.getElementById("nombreCliente").value.trim()
    ){
        alert(
            "Seleccione un cliente o presione Consumidor Final " +
            "antes de guardar la factura."
        );
        return;
    }

    if(venta.productos.length===0){
        alert("Agregue al menos un producto a la factura.");
        return;
    }

    if(!cai || !cai.id){
        alert("No hay un CAI activo disponible.");
        return;
    }

    const numeroActual = Number(cai.numero_actual);
    const rangoFinal = Number(cai.rango_final);

    if(!Number.isFinite(numeroActual) || numeroActual>rangoFinal){
        alert("El rango autorizado del CAI está agotado.");
        return;
    }

    const { data:sesion } =
        await supabaseClient.auth.getSession();

    if(!sesion.session){
        location.href="login.html";
        return;
    }

    const boton = document.getElementById(
        "btnGuardarFactura"
    );

    guardandoFactura=true;
    boton.disabled=true;
    boton.innerHTML="Guardando...";

    const totales=obtenerTotales();

    try{

        const { data:factura, error:errorFactura } =
            await supabaseClient
            .from("facturas")
            .insert({
                numero_factura:numeroActual,
                cliente_id:venta.cliente.id,
                nombre_cliente:document.getElementById(
                    "nombreCliente"
                ).value,
                rtn_cliente:document.getElementById(
                    "rtnCliente"
                ).value || null,
                direccion_cliente:document.getElementById(
                    "direccionCliente"
                ).value || null,
                fecha:new Date().toISOString(),
                subtotal:totales.subtotal,
                isv:totales.isv,
                descuento:totales.descuento,
                total:totales.total,
                cai_id:cai.id,
                usuario_id:sesion.session.user.id,
                estado:"emitida"
            })
            .select("id")
            .single();

        if(errorFactura){
            throw errorFactura;
        }

        const detalle = venta.productos.map(item=>({
            factura_id:factura.id,
            producto:item.nombre,
            cantidad:item.cantidad,
            precio_unitario:item.precio,
            descuento:0,
            total:item.total
        }));

        const { error:errorDetalle } =
            await supabaseClient
            .from("factura_detalle")
            .insert(detalle);

        if(errorDetalle){
            throw errorDetalle;
        }

        const { data:caiActualizado, error:errorCAI } =
            await supabaseClient
            .from("cai_facturacion")
            .update({
                numero_actual:numeroActual + 1
            })
            .eq("id",cai.id)
            .eq("numero_actual",numeroActual)
            .select("id")
            .maybeSingle();

        if(errorCAI || !caiActualizado){
            throw errorCAI || new Error(
                "No fue posible actualizar el correlativo del CAI."
            );
        }

        cai.numero_actual=numeroActual + 1;
        facturaGuardada=factura;
        boton.innerHTML="✅ Factura guardada";

        alert("Factura guardada correctamente.");

    }catch(error){

        console.error(error);
        alert("No se pudo guardar la factura: " + error.message);
        boton.disabled=false;
        boton.innerHTML="💾 Guardar Factura";

    }finally{

        guardandoFactura=false;

    }

}

        function imprimirFactura(){

    if(venta.productos.length===0){
        alert("Agregue productos antes de imprimir.");
        return;
    }

    window.print();

}

        function cancelarFactura(){

    if(
        venta.productos.length>0 &&
        !confirm("¿Desea cancelar la factura en curso?")
    ){
        return;
    }

    location.href="menu.html";

}


        let listaClientes = [];

        let clienteSeleccionado = null;

</script>

</body>
