<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configuración de rutas</title>
<link rel="icon" href="img/favicon_64.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--azul:#075985;--celeste:#0284c7;--verde:#059669;--rojo:#dc2626;--texto:#102a43;--muted:#64748b;--borde:#dbe7ef}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--texto);background:linear-gradient(180deg,#dff5f7,#f6f9fc 320px);min-height:100vh}header{padding:22px max(16px,calc((100% - 1160px)/2));color:#fff;background:linear-gradient(135deg,#064e6f,#0284c7);box-shadow:0 8px 28px #07598538}.head{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{margin:0;font-size:clamp(26px,4vw,37px)}header p{margin:5px 0 0;color:#dff6ff}.volver{width:auto;padding:12px 16px;border:1px solid #ffffff55;background:#ffffff20}.pagina{max-width:1160px;margin:auto;padding:22px 14px 70px}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px;align-items:start}.card{background:#fffffff5;border:1px solid var(--borde);border-radius:20px;padding:20px;box-shadow:0 10px 30px #0f405b14}.formulario{position:sticky;top:15px}.titulo{margin:0 0 5px;font-size:21px}.ayuda{margin:0 0 18px;color:var(--muted);font-size:14px}label{display:block;margin:0 0 6px;font-size:14px;font-weight:800;color:#334155}input,select,button{width:100%;padding:13px 14px;margin-bottom:13px;border-radius:11px;font-size:16px}input,select{border:1px solid #cbd5e1;background:#fff}input:focus,select:focus{outline:3px solid #0ea5e926;border-color:#0ea5e9}button{border:0;background:linear-gradient(135deg,#0369a1,#0284c7);color:#fff;font-weight:800;cursor:pointer}.guardar{background:linear-gradient(135deg,#047857,#059669);min-height:52px}.secundario{background:#fff;color:#075985;border:1px solid #bae6fd}.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}.barra{display:flex;align-items:center;gap:10px;margin-bottom:15px}.barra input{margin:0}.contador{white-space:nowrap;padding:10px 12px;border-radius:999px;background:#e0f2fe;color:#075985;font-weight:800}.lista{display:grid;gap:12px}.ruta{padding:17px;border:1px solid var(--borde);border-radius:16px;background:#fff}.ruta-head{display:flex;justify-content:space-between;gap:10px}.ruta h3{margin:0 0 4px}.numero{padding:6px 9px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:12px;font-weight:900}.ruta p{margin:7px 0;color:#475569}.estado{display:inline-block;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px;font-weight:800}.estado.inactiva{background:#fee2e2;color:#991b1b}.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.acciones button{margin:0;padding:10px 6px;font-size:13px}.acciones .sincronizar{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}.acciones .estado-btn{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.vacio{text-align:center;padding:45px 15px;border:1px dashed #cbd5e1;border-radius:15px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr}.formulario{position:static}}@media(max-width:600px){header{padding:18px 14px}.volver{width:47px;font-size:0}.volver:after{content:'←';font-size:22px}.pagina{padding:14px 10px 50px}.card{padding:16px;border-radius:17px}.fila{grid-template-columns:1fr;gap:0}.barra{flex-direction:column;align-items:stretch}.contador{text-align:center}}
</style>
</head>
<body>
<header><div class="head"><div><h1>🗺️ Rutas por municipio</h1><p>Programa los días, municipios y repartidores.</p></div><button class="volver" onclick="location.href='menu.html'">← Menú</button></div></header>
<main class="pagina"><div class="grid">
<section class="card formulario">
<h2 id="tituloFormulario" class="titulo">➕ Nueva ruta</h2><p class="ayuda">La numeración se asigna automáticamente.</p>
<label for="nombre">Nombre de la ruta *</label><input id="nombre" placeholder="Ej. RUTA LA UNIÓN">
<label for="municipio">Municipio *</label><input id="municipio" placeholder="Ej. LA UNIÓN">
<div class="fila"><div><label for="dia">Día de visita *</label><select id="dia"><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option></select></div><div><label for="chofer">Repartidor</label><select id="chofer"><option value="">Sin asignar</option></select></div></div>
<div class="fila"><div><label for="latitud">Latitud *</label><input id="latitud" inputmode="decimal" placeholder="14.000000"></div><div><label for="longitud">Longitud *</label><input id="longitud" inputmode="decimal" placeholder="-86.000000"></div></div>
<button class="secundario" onclick="capturarUbicacion()">📍 Capturar ubicación actual</button>
<button id="btnGuardar" class="guardar" onclick="guardarRuta()">💾 Guardar ruta</button>
<button id="btnCancelar" class="secundario" style="display:none" onclick="limpiarFormulario()">✕ Cancelar edición</button>
</section>
<section class="card"><h2 class="titulo">Rutas programadas</h2><p class="ayuda">Sincronice cada ruta para agregar los clientes registrados en ese municipio.</p><div class="barra"><input id="buscar" placeholder="🔍 Buscar ruta o municipio" oninput="mostrarRutas()"><span id="contador" class="contador">0 rutas</span></div><div id="lista" class="lista"></div></section>
</div></main>
<script>
const SUPABASE_URL="https://ayzddkcxeswjfpinwvth.supabase.co";
const SUPABASE_KEY="sb_publishable_34T_1LZ8Brpa_3sq2vT_Ew_AIvOuTDl";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DIAS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
let rutas=[],choferes=[],rutaEditando=null;
window.onload=iniciar;
async function iniciar(){if(!await verificarAdmin())return;await cargarChoferes();await cargarRutas()}
async function verificarAdmin(){const {data}=await supabaseClient.auth.getUser();if(!data.user){location.href="login.html";return false}const {data:perfil}=await supabaseClient.from("usuarios").select("rol").eq("id",data.user.id).single();if(perfil?.rol!=="administrador"){alert("Acceso exclusivo para administradores.");location.href="menu.html";return false}return true}
async function cargarChoferes(){const {data,error}=await supabaseClient.from("usuarios").select("id,nombre,camion").eq("rol","chofer").order("nombre");if(error){alert(error.message);return}choferes=data||[];document.getElementById("chofer").innerHTML='<option value="">Sin asignar</option>'+choferes.map(c=>`<option value="${c.id}">${esc(c.nombre)}${c.camion?' · '+esc(c.camion):''}</option>`).join("")}
async function cargarRutas(){const {data,error}=await supabaseClient.from("rutas").select("*").order("numero");if(error){mostrarErrorTabla(error);return}rutas=data||[];mostrarRutas()}
function mostrarRutas(){const texto=document.getElementById("buscar").value.toLowerCase();const lista=rutas.filter(r=>(r.nombre+" "+r.municipio).toLowerCase().includes(texto));document.getElementById("contador").textContent=`${lista.length} ${lista.length===1?'ruta':'rutas'}`;document.getElementById("lista").innerHTML=lista.length?lista.map(r=>{const chofer=choferes.find(c=>c.id===r.usuario_id);return `<article class="ruta"><div class="ruta-head"><div><h3>${esc(r.nombre)}</h3><span class="estado ${r.activo?'':'inactiva'}">${r.activo?'ACTIVA':'INACTIVA'}</span></div><span class="numero">RUTA-${String(r.numero).padStart(4,'0')}</span></div><p>📍 <b>${esc(r.municipio)}</b> · ${DIAS[r.dia_semana]}</p><p>🚚 ${chofer?esc(chofer.nombre)+(chofer.camion?' · '+esc(chofer.camion):''):'Sin repartidor'}</p><div class="acciones"><button onclick="editarRuta('${r.id}')">✏️ Editar</button><button class="sincronizar" onclick="sincronizarClientes('${r.id}')">👥 Clientes</button><button class="estado-btn" onclick="cambiarEstado('${r.id}',${!r.activo})">${r.activo?'⏸️ Pausar':'▶️ Activar'}</button></div></article>`}).join(""):'<div class="vacio">🗺️<br><b>No hay rutas para mostrar.</b></div>'}
async function guardarRuta(){const datos={nombre:valor("nombre").toUpperCase(),municipio:valor("municipio").toUpperCase(),dia_semana:Number(valor("dia")),usuario_id:valor("chofer")||null,latitud:Number(valor("latitud")),longitud:Number(valor("longitud"))};if(!datos.nombre||!datos.municipio||!Number.isFinite(datos.latitud)||!Number.isFinite(datos.longitud)){alert("Complete el nombre, municipio y coordenadas.");return}const boton=document.getElementById("btnGuardar");boton.disabled=true;boton.textContent="Guardando...";const consulta=rutaEditando?supabaseClient.from("rutas").update(datos).eq("id",rutaEditando):supabaseClient.from("rutas").insert(datos);const {error}=await consulta;if(error){alert(error.message);boton.disabled=false;boton.textContent="💾 Guardar ruta";return}limpiarFormulario();await cargarRutas()}
function editarRuta(id){const r=rutas.find(x=>x.id===id);if(!r)return;rutaEditando=id;["nombre","municipio","latitud","longitud"].forEach(c=>document.getElementById(c).value=r[c]);document.getElementById("dia").value=r.dia_semana;document.getElementById("chofer").value=r.usuario_id||"";document.getElementById("tituloFormulario").textContent=`✏️ Editar RUTA-${String(r.numero).padStart(4,'0')}`;document.getElementById("btnGuardar").textContent="💾 Actualizar ruta";document.getElementById("btnCancelar").style.display="block";scrollTo({top:0,behavior:"smooth"})}
function limpiarFormulario(){rutaEditando=null;["nombre","municipio","latitud","longitud"].forEach(id=>document.getElementById(id).value="");document.getElementById("dia").value="1";document.getElementById("chofer").value="";document.getElementById("tituloFormulario").textContent="➕ Nueva ruta";document.getElementById("btnGuardar").disabled=false;document.getElementById("btnGuardar").textContent="💾 Guardar ruta";document.getElementById("btnCancelar").style.display="none"}
async function cambiarEstado(id,activo){const {error}=await supabaseClient.from("rutas").update({activo}).eq("id",id);if(error){alert(error.message);return}await cargarRutas()}
async function sincronizarClientes(id){const ruta=rutas.find(r=>r.id===id);if(!ruta)return;const {data:clientes,error}=await supabaseClient.from("clientes").select("id,nombre,latitud,longitud").ilike("municipio",ruta.municipio).not("latitud","is",null).not("longitud","is",null).order("nombre");if(error){alert(error.message);return}if(!clientes?.length){alert("No hay clientes con coordenadas registrados en "+ruta.municipio+".");return}const filas=clientes.map((c,i)=>({ruta_id:id,cliente_id:c.id,orden:i+1}));const {error:errorInsert}=await supabaseClient.from("ruta_clientes").upsert(filas,{onConflict:"ruta_id,cliente_id"});if(errorInsert){alert(errorInsert.message);return}alert(`${clientes.length} clientes sincronizados con la ruta.`)}
function capturarUbicacion(){if(!navigator.geolocation){alert("Este dispositivo no soporta GPS.");return}navigator.geolocation.getCurrentPosition(p=>{document.getElementById("latitud").value=p.coords.latitude.toFixed(7);document.getElementById("longitud").value=p.coords.longitude.toFixed(7)},()=>alert("No fue posible obtener la ubicación."),{enableHighAccuracy:true,timeout:10000})}
function mostrarErrorTabla(error){const mensaje=error.message.includes("rutas")?"Primero ejecute el archivo rutas.sql en Supabase.":error.message;document.getElementById("lista").innerHTML=`<div class="vacio">⚠️<br>${esc(mensaje)}</div>`}
function valor(id){return document.getElementById(id).value.trim()}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
document.addEventListener("input",e=>{if(e.target.matches("#nombre,#municipio"))e.target.value=e.target.value.toUpperCase()});
</script>
</body>
</html>
