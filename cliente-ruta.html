<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agregar cliente a ruta</title><link rel="icon" href="img/favicon_64.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--azul:#075985;--celeste:#0284c7;--verde:#059669;--texto:#102a43;--muted:#64748b;--borde:#dbe7ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--texto);background:linear-gradient(180deg,#dff5f7,#f5f9fc 310px)}header{padding:22px max(15px,calc((100% - 820px)/2));color:#fff;background:linear-gradient(135deg,#064e6f,#0284c7);box-shadow:0 8px 28px #07598538}.head{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{margin:0;font-size:clamp(25px,4vw,36px)}header p{margin:5px 0 0;color:#dff6ff}.volver{width:auto;padding:11px 15px;margin:0;border:1px solid #ffffff55;background:#ffffff20}.pagina{max-width:820px;margin:auto;padding:20px 14px 70px}.guia{display:flex;gap:11px;align-items:center;padding:14px 16px;margin-bottom:15px;border:1px solid #bae6fd;border-radius:15px;background:#f0f9ff;color:#075985;font-weight:700}.card{padding:22px;border:1px solid var(--borde);border-radius:20px;background:#fffffff5;box-shadow:0 10px 30px #0f405b14}.card h2{margin:0 0 5px}.ayuda{margin:0 0 19px;color:var(--muted);font-size:14px}.fila{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:block;margin:0 0 6px;font-size:14px;font-weight:800;color:#334155}.campo{margin-bottom:16px}input,select,button{width:100%;padding:13px 14px;border-radius:11px;font-size:16px}input,select{border:1px solid #cbd5e1;background:#fff;color:var(--texto)}input[readonly]{background:#f8fafc}input:focus,select:focus{outline:3px solid #0ea5e926;border-color:#0ea5e9}button{border:0;color:#fff;background:linear-gradient(135deg,#0369a1,#0284c7);font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.gps{margin-bottom:13px;background:#eff6ff;color:#1d4ed8;border:1px solid #93c5fd}.guardar{min-height:53px;background:linear-gradient(135deg,#047857,#059669)}.estado{text-align:center;min-height:23px;margin-top:13px;font-weight:800}.ubicacion-ok{padding:10px;margin:-5px 0 13px;border-radius:10px;text-align:center;color:#166534;background:#dcfce7;font-size:13px;font-weight:700}@media(max-width:620px){header{padding:18px 13px}.volver{font-size:0;width:45px}.volver:after{content:'←';font-size:22px}.pagina{padding:14px 10px 50px}.card{padding:17px;border-radius:17px}.fila{grid-template-columns:1fr;gap:0}}
</style>
</head>
<body>
<header><div class="head"><div><h1>👤 Cliente de ruta</h1><p>Registre una parada nueva desde el recorrido.</p></div><button class="volver" onclick="location.href='menu.html'">← Menú</button></div></header>
<main class="pagina"><div class="guia"><span>📍</span><span>Seleccione una de sus rutas y capture la ubicación frente al cliente.</span></div><section class="card"><h2>Agregar cliente</h2><p class="ayuda">El municipio se tomará automáticamente de la ruta seleccionada.</p>
<div class="campo"><label for="ruta">Ruta asignada *</label><select id="ruta" onchange="actualizarMunicipio()"><option value="">Cargando rutas...</option></select></div>
<div class="campo"><label for="nombre">Nombre completo *</label><input id="nombre" placeholder="NOMBRE DEL CLIENTE" autocomplete="name"></div>
<div class="fila"><div class="campo"><label for="telefono">Teléfono *</label><input id="telefono" placeholder="9999-9999" inputmode="tel" autocomplete="tel"></div><div class="campo"><label for="identificacion">RTN o DNI</label><input id="identificacion" placeholder="IDENTIFICACIÓN"></div></div>
<div class="fila"><div class="campo"><label for="municipio">Municipio</label><input id="municipio" readonly></div><div class="campo"><label for="barrio">Barrio o aldea *</label><input id="barrio" placeholder="BARRIO O ALDEA"></div></div>
<div class="campo"><label for="referencia">Referencia *</label><input id="referencia" placeholder="COLOR DE CASA O PUNTO DE REFERENCIA"></div>
<button id="btnGps" class="gps" onclick="capturarUbicacion()">📡 Capturar ubicación del cliente</button><div id="ubicacionEstado"></div>
<button id="btnGuardar" class="guardar" onclick="guardarCliente()">✅ Guardar y asignar a la ruta</button><div id="estado" class="estado"></div>
</section></main>
<script>
const SUPABASE_URL="https://ayzddkcxeswjfpinwvth.supabase.co";const SUPABASE_KEY="sb_publishable_34T_1LZ8Brpa_3sq2vT_Ew_AIvOuTDl";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let usuario=null,perfil=null,rutas=[],latitud=null,longitud=null,guardando=false;
window.onload=iniciar;
async function iniciar(){if(!await cargarPerfil())return;await cargarRutas()}
async function cargarPerfil(){const {data}=await supabaseClient.auth.getUser();if(!data.user){location.href="login.html";return false}usuario=data.user;const resultado=await supabaseClient.from("usuarios").select("rol,nombre").eq("id",usuario.id).single();perfil=resultado.data;if(!perfil||!["chofer","administrador"].includes(perfil.rol)){alert("Acceso denegado.");location.href="menu.html";return false}return true}
async function cargarRutas(){let ids=null;if(perfil.rol==="chofer"){const asignaciones=await supabaseClient.from("ruta_choferes").select("ruta_id").eq("usuario_id",usuario.id);if(asignaciones.error){alert("Ejecute rutas-actualizacion-choferes.sql en Supabase.");return}ids=(asignaciones.data||[]).map(a=>a.ruta_id)}let consulta=supabaseClient.from("rutas").select("id,numero,nombre,municipio,activo").eq("activo",true).order("numero");if(ids)consulta=ids.length?consulta.in("id",ids):consulta.eq("id","00000000-0000-0000-0000-000000000000");const {data,error}=await consulta;if(error){alert(error.message);return}rutas=data||[];document.getElementById("ruta").innerHTML='<option value="">Seleccione una ruta</option>'+rutas.map(r=>`<option value="${r.id}">RUTA-${String(r.numero).padStart(4,"0")} · ${esc(r.municipio)}</option>`).join("");if(!rutas.length)document.getElementById("estado").textContent="No tiene rutas activas asignadas."}
function actualizarMunicipio(){const ruta=rutas.find(r=>r.id===document.getElementById("ruta").value);document.getElementById("municipio").value=ruta?.municipio||""}
function capturarUbicacion(){if(!navigator.geolocation){alert("Este dispositivo no soporta GPS.");return}const boton=document.getElementById("btnGps");boton.disabled=true;boton.textContent="📡 Obteniendo ubicación...";navigator.geolocation.getCurrentPosition(p=>{latitud=p.coords.latitude;longitud=p.coords.longitude;boton.textContent="✅ Ubicación capturada";document.getElementById("ubicacionEstado").innerHTML=`<div class="ubicacion-ok">Precisión aproximada: ${Math.round(p.coords.accuracy)} metros</div>`},()=>{boton.disabled=false;boton.textContent="📡 Intentar nuevamente";alert("No fue posible obtener la ubicación.")},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function guardarCliente(){if(guardando)return;const rutaId=valor("ruta");const ruta=rutas.find(r=>r.id===rutaId);const cliente={nombre:valor("nombre").toUpperCase(),telefono:valor("telefono"),identificacion:valor("identificacion").toUpperCase()||null,municipio:ruta?.municipio||"",barrio:valor("barrio").toUpperCase(),referencia:valor("referencia").toUpperCase(),tipo_cliente:"Cliente Final",latitud,longitud};if(!ruta||!cliente.nombre||!cliente.telefono||!cliente.barrio||!cliente.referencia){alert("Complete todos los campos obligatorios.");return}if(latitud===null||longitud===null){alert("Capture la ubicación del cliente antes de guardar.");return}guardando=true;const boton=document.getElementById("btnGuardar");boton.disabled=true;boton.textContent="Guardando...";let clienteId;const existente=await supabaseClient.from("clientes").select("id,nombre").eq("telefono",cliente.telefono).maybeSingle();if(existente.error){fallar(existente.error);return}if(existente.data){if(!confirm(`El teléfono pertenece a ${existente.data.nombre}. ¿Asignar ese cliente a la ruta sin duplicarlo?`)){restaurar();return}clienteId=existente.data.id}else{const resultado=await supabaseClient.from("clientes").insert(cliente).select("id").single();if(resultado.error){fallar(resultado.error);return}clienteId=resultado.data.id}const ordenResultado=await supabaseClient.from("ruta_clientes").select("orden").eq("ruta_id",rutaId).order("orden",{ascending:false}).limit(1);const orden=Number(ordenResultado.data?.[0]?.orden||0)+1;const asignacion=await supabaseClient.from("ruta_clientes").upsert({ruta_id:rutaId,cliente_id:clienteId,orden},{onConflict:"ruta_id,cliente_id"});if(asignacion.error){fallar(asignacion.error);return}document.getElementById("estado").style.color="#047857";document.getElementById("estado").textContent="Cliente guardado y asignado correctamente.";setTimeout(()=>location.href="ruta-repartidor.html",900)}
function fallar(error){console.error(error);document.getElementById("estado").style.color="#b91c1c";document.getElementById("estado").textContent="No se pudo guardar: "+error.message;restaurar()}function restaurar(){guardando=false;document.getElementById("btnGuardar").disabled=false;document.getElementById("btnGuardar").textContent="✅ Guardar y asignar a la ruta"}function valor(id){return document.getElementById(id).value.trim()}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
document.addEventListener("input",e=>{if(e.target.matches("#nombre,#identificacion,#barrio,#referencia"))e.target.value=e.target.value.toUpperCase()});
</script>
</body>
</html>
